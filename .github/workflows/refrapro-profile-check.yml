name: ReFraPro Profile Build APK

on:
  push:
    branches:
      - refrapro/profiles-phase1-2
  pull_request:
    branches:
      - refrapro/profiles-phase1-2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refrapro-profile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build universal NoML debug APK
        run: ./gradlew --no-daemon :app:androidApp:assembleUniversalNoMLDebug
      - name: Verify APK output
        run: |
          set -euo pipefail
          find app/androidApp/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/androidApp/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ReFraPro-universal-NoML-debug
          path: app/androidApp/build/outputs/apk/universalNoML/debug/*.apk
          if-no-files-found: error
          retention-days: 14
