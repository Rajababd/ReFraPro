name: ReFraPro Optimized ARM64 APK

on:
  push:
    branches:
      - refrapro/profiles-phase1-2
  pull_request:
    branches:
      - refrapro/profiles-phase1-2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refrapro-profile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install pinned Android CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "cmake;3.31.6"
          test -x "$ANDROID_HOME/cmake/3.31.6/bin/cmake"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run common app host tests
        run: ./gradlew --no-daemon :app:commonApp:testAndroidHostTest
      - name: Build optimized ARM64 NoML APK
        run: ./gradlew --no-daemon :app:androidApp:assembleArm64-v8aNoMLOptimized
      - name: Verify optimized APK output
        run: |
          set -euo pipefail
          APK_DIR="app/androidApp/build/outputs/apk-renamed/arm64-v8aNoML/optimized"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print
          APK_COUNT="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -eq 1
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          echo "Optimized APK: $APK_PATH"
          ls -lh "$APK_PATH"
      - name: Upload optimized APK only
        uses: actions/upload-artifact@v4
        with:
          name: ReFraPro-ARM64-NoML-Optimized
          path: app/androidApp/build/outputs/apk-renamed/arm64-v8aNoML/optimized/*.apk
          if-no-files-found: error
          retention-days: 14
