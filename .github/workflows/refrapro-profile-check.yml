name: ReFraPro Profile Compile Check

on:
  push:
    branches:
      - refrapro/profiles-phase1-2
  pull_request:
    branches:
      - refrapro/profiles-phase1-2

permissions:
  contents: read

concurrency:
  group: refrapro-profile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Compile ReFraPro Android variant
        run: ./gradlew --no-daemon :app:androidApp:compileUniversalNoMLDebugKotlin
